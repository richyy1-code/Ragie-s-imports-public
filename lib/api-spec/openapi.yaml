openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ragies Imports commerce and order management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Customer-facing product and order operations
  - name: admin
    description: Order-management operations
paths:
  /admin/eta-reminders:
    get:
      operationId: getAdminEtaReminders
      tags: [admin]
      responses:
        "200":
          description: In-app staff arrival alerts and chronological batch dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffEtaOverview"
  /admin/sms:
    get:
      operationId: getAdminSms
      tags: [admin]
      responses:
        "200":
          description: Live SMS configuration and recent notification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsOverview"
  /admin/sms/test:
    post:
      operationId: sendAdminTestSms
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsTestInput"
      responses:
        "201":
          description: Explicitly authorized live test message queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsNotification"
  /account/profile:
    get:
      operationId: getAccountProfile
      summary: Read the signed-in account's saved contact phone
      responses:
        "200":
          description: Contact preference, not verified identity or order ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountContactProfile"
        "401":
          description: Sign-in required
    patch:
      operationId: updateAccountProfile
      summary: Save or remove the signed-in account's contact phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountContactInput"
      responses:
        "200":
          description: Saved contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountContactProfile"
        "400":
          description: Invalid phone number
        "401":
          description: Sign-in required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [storefront]
      summary: List product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: List products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: availability
          in: query
          schema:
            type: string
            enum: [ghana-stock, pre-order, all]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, newest, price-low, price-high]
            default: featured
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: Get a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /content:
    get:
      operationId: getSiteContent
      tags: [storefront]
      summary: Get editable storefront content
      responses:
        "200":
          description: Storefront content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      operationId: createOrder
      tags: [storefront]
      summary: Place a customer order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/track:
    get:
      operationId: trackOrder
      tags: [storefront]
      summary: Look up an order
      parameters:
        - name: orderNumber
          in: query
          required: true
          schema:
            type: string
        - name: phone
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/orders:
    get:
      operationId: listMyOrders
      tags: [storefront]
      summary: List the signed-in customer's orders
      responses:
        "200":
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me/orders/{id}/payment:
    post:
      operationId: prepareOrderPayment
      tags: [storefront]
      summary: Prepare an outstanding order payment for the signed-in customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentPreparationInput"
      responses:
        "200":
          description: Validated payment details ready for provider checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPreparation"
        "400":
          description: No payable balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{id}/payment:
    post:
      operationId: initializeCheckoutPayment
      tags: [storefront]
      summary: Initialize the required Paystack payment for a newly placed order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPaymentInput"
      responses:
        "200":
          description: Paystack checkout initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPreparation"
        "400":
          description: Invalid payment amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /admin/settings/exchange-rate:
    get:
      operationId: getExchangeRate
      tags: [admin]
      summary: Get the current CNY per GHS exchange rate
      responses:
        "200":
          description: Current exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
    patch:
      operationId: updateExchangeRate
      tags: [admin]
      summary: Update the current CNY per GHS exchange rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateInput"
      responses:
        "200":
          description: Updated exchange rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
  /admin/inventory:
    get:
      operationId: listAdminInventory
      tags: [admin]
      summary: List all inventory including hidden and sold-out products
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /admin/inventory/{id}:
    patch:
      operationId: updateInventory
      tags: [admin]
      summary: Restock, adjust, hide, or restore a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUpdate"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/customers:
    get:
      operationId: listCustomers
      tags: [admin]
      summary: Search customer records and order history
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customer records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
  /admin/access/me:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Get the signed-in staff member's role and permissions
      responses:
        "200":
          description: Current staff access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /admin/staff:
    get:
      operationId: listStaff
      tags: [admin]
      summary: List staff access
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: createStaff
      tags: [admin]
      summary: Give an existing signed-up user staff access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Staff access created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /admin/staff/{id}:
    delete:
      operationId: removeStaff
      tags: [admin]
      summary: Owner-only removal of staff access without deleting the account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Staff access removed; customer account and orders preserved
        "401":
          description: Sign-in required
        "403":
          description: Only an owner can remove staff
        "404":
          description: Staff member not found
        "409":
          description: Permanent owners cannot be removed
    patch:
      operationId: updateStaff
      tags: [admin]
      summary: Change or deactivate staff access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Staff access updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
  /admin/products/batches:
    get:
      operationId: listProductBatches
      tags: [admin]
      summary: Minimal shipment choices for product staff without shipment or customer records
      responses:
        "200":
          description: Batch choices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductBatch"
  /admin/data-protection:
    get:
      operationId: getDataProtectionSummary
      tags: [admin]
      summary: Get database protection and recovery status
      responses:
        "200":
          description: Data protection summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProtectionSummary"
  /admin/data-protection/clear-test-orders:
    post:
      operationId: clearTestOrders
      tags: [admin]
      summary: Permanently clear test order history and statistics (verified owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestOrderResetInput"
      responses:
        "200":
          description: Test orders removed; order-derived statistics recalculate from remaining data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestOrderResetResult"
        "400":
          description: Confirmation does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Verified owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/data-protection/fresh-start:
    post:
      operationId: resetLaunchData
      tags: [admin]
      summary: Owner-only permanent removal of test products, orders and non-owner accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchResetInput"
      responses:
        "200":
          description: Reset counts, including any account deletions requiring retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchResetResult"
        "403":
          description: Verified owner access required
        "409":
          description: Launch reset currently running
  /admin/data-protection/export:
    get:
      operationId: exportDataSnapshot
      tags: [admin]
      summary: Export a complete operational data snapshot
      responses:
        "200":
          description: Downloadable data snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSnapshot"
  /admin/content:
    patch:
      operationId: updateSiteContent
      tags: [admin]
      summary: Update storefront content and contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentUpdate"
      responses:
        "200":
          description: Updated storefront content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List and filter all orders
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: paymentStatus
          in: query
          schema:
            type: string
        - name: availability
          in: query
          schema:
            type: string
        - name: customer
          in: query
          schema:
            type: string
        - name: product
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
        - name: dateTo
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createAdminOrder
      tags: [admin]
      summary: Create an order manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /admin/orders/trash:
    get:
      operationId: listDeletedAdminOrders
      tags: [admin]
      summary: List soft-deleted orders
      responses:
        "200":
          description: Deleted orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /admin/orders/{id}:
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      summary: Update an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAdminOrder
      tags: [admin]
      summary: Move an order to the recycle bin
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Order moved to recycle bin
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/orders/{id}/restore:
    post:
      operationId: restoreAdminOrder
      tags: [admin]
      summary: Restore an order from the recycle bin
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Restored order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/products:
    post:
      operationId: createProduct
      tags: [admin]
      summary: Add a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product or its stock
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: archiveProduct
      tags: [admin]
      summary: Hide a product from the storefront
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product archived
  /admin/products/{id}/permanent:
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Permanently delete a product, preserving historical order snapshots
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product permanently deleted
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /promotions:
    get:
      operationId: listPromotions
      tags: [storefront]
      summary: List currently visible promotions
      responses:
        "200":
          description: Active public promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"
  /promotions/preview:
    post:
      operationId: previewPromotion
      tags: [storefront]
      summary: Preview a promo code against cart items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionPreviewInput"
      responses:
        "200":
          description: Discounted cart totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPreview"
  /admin/promotions:
    get:
      operationId: listAdminPromotions
      tags: [admin]
      summary: List all promotions
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Promotion"
    post:
      operationId: createPromotion
      tags: [admin]
      summary: Create a promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionInput"
      responses:
        "201":
          description: Created promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
  /admin/promotions/{id}:
    patch:
      operationId: updatePromotion
      tags: [admin]
      summary: Update a promotion
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionUpdate"
      responses:
        "200":
          description: Updated promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Promotion"
    delete:
      operationId: deletePromotion
      tags: [admin]
      summary: Delete a promotion
      parameters:
        - $ref: "#/components/parameters/PromotionId"
      responses:
        "204":
          description: Promotion deleted
  /admin/shipments:
    get:
      operationId: listShipments
      tags: [admin]
      summary: List import shipments
      responses:
        "200":
          description: Shipments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shipment"
    post:
      operationId: createShipment
      tags: [admin]
      summary: Create an import shipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
  /admin/shipments/{id}:
    patch:
      operationId: updateShipment
      tags: [admin]
      summary: Update an import shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentUpdate"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shipment"
    delete:
      operationId: deleteShipment
      tags: [admin]
      summary: Delete an import shipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Shipment deleted
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PromotionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    AccountContactProfile:
      type: object
      required: [phone]
      properties:
        phone: { type: ["string", "null"] }
    AccountContactInput:
      type: object
      required: [phone]
      properties:
        phone: { type: ["string", "null"], maxLength: 30 }
    BatchDateEvent:
      type: object
      required: [id, batchId, batchName, batchStatus, type, date, productNames, daysUntil, urgent, hasClosingDates]
      properties:
        id: { type: string }
        batchId: { type: integer }
        batchName: { type: string }
        batchStatus: { type: string }
        type: { type: string, enum: [closing, arrival, product-arrival] }
        date: { type: string }
        productNames:
          type: array
          items: { type: string }
        daysUntil: { type: integer }
        urgent: { type: boolean }
        hasClosingDates: { type: boolean }
    StaffEtaAlert:
      type: object
      required: [id, type, entityId, name, expectedArrival, severity, daysOverdue, batchId, batchName]
      properties:
        id: { type: string }
        type: { type: string, enum: [shipment, product] }
        entityId: { type: integer }
        name: { type: string }
        expectedArrival: { type: string }
        severity: { type: string, enum: [due-today, overdue] }
        daysOverdue: { type: integer }
        batchId: { type: [integer, "null"] }
        batchName: { type: [string, "null"] }
    StaffEtaOverview:
      type: object
